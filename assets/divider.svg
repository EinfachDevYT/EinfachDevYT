    <stop offset="0%" stop-color="#A855F7"/>
    <stop offset="50%" stop-color="#E9D5FF"/>
    <stop offset="100%" stop-color="#6D28D9"/>
  </linearGradient>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
