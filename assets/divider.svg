<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="img">
<defs>
  <radialGradient id="vg" cx="34%" cy="34%" r="90%">
    <stop offset="0%" stop-color="#171226"/>
    <stop offset="52%" stop-color="#0D0B14"/>
    <stop offset="100%" stop-color="#060510"/>
